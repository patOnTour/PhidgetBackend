version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescale_db
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /volume1/docker/telemetry/timescale_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - telemetry_net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  fastapi_ingest:
    build: ./api
    container_name: fastapi_ingest
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_TOKEN: ${API_TOKEN}
      YAML_CONFIG_PATH: /app/config
    volumes:
      - ./phidget-dashboard/config:/app/config:ro
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
    networks:
      - telemetry_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - fastapi_ingest
    networks:
      - telemetry_net

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy-server
    restart: unless-stopped
    command:
      - serve
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL}
      - NTFY_BEHIND_PROXY=true
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT=5G
      - NTFY_ATTACHMENT_FILE_SIZE_LIMIT=15M
      - NTFY_ATTACHMENT_EXPIRY_DURATION=48h
    volumes:
      - ./ntfy_cache:/var/cache/ntfy
    ports:
      - "8085:80"
    networks:
      - telemetry_net

  setting-control:
    image: python:3.11-slim
    container_name: concretum-control
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - YAML_CONFIG_PATH=/app/config
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_ROOT_USER_ACTION=ignore
    volumes:
      - ./phidget-dashboard:/app
    command: >
      sh -c "pip install -q --no-cache-dir flask requests psycopg2-binary pyyaml filelock && python app.py"
    ports:
      - "8080:8080"
    depends_on:
      - timescaledb
    networks:
      - telemetry_net

  server-analyzer:
    image: python:3.11-slim
    container_name: server_analyzer
    mem_limit: 256m
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - NTFY_URL=http://ntfy:80
      - ARCHIVE_DIR=/app/archive
      - YAML_CONFIG_PATH=/app/config
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_ROOT_USER_ACTION=ignore
    volumes:
      - ./analyzer:/app
      - ./phidget-dashboard/archive:/app/archive
      - ./phidget-dashboard/config:/app/config
    command: >
      sh -c "pip install -q --no-cache-dir psycopg2-binary requests numpy pandas matplotlib pyyaml && python server_analyzer.py"
    depends_on:
      - timescaledb
      - ntfy
    networks:
      - telemetry_net

  probe-detector:
    image: python:3.11-slim
    container_name: probe_detector_analyzer
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - NTFY_URL=http://ntfy:80
      - INGEST_CONTROL_URL=https://telemetry.concretum-setting.com/api/v1/control/start-channel
      - YAML_CONFIG_PATH=/app/config
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_ROOT_USER_ACTION=ignore
    volumes:
      - ./analyzer:/app
      - ./phidget-dashboard/config:/app/config
    command: >
      sh -c "pip install -q --no-cache-dir psycopg2-binary requests pyyaml numpy && python3 -u probe_detector_analyzer.py"
    depends_on:
      - timescaledb
      - ntfy
    networks:
      - telemetry_net

networks:
  telemetry_net:
    driver: bridge